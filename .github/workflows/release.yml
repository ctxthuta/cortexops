name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build plugin archive
        run: |
          mkdir -p dist
          cd plugin
          zip -r ../dist/cortexops-${{ github.ref_name }}.zip .
          cd ..
          sha256sum dist/cortexops-${{ github.ref_name }}.zip > dist/checksums.txt
          cat dist/checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CortexOps ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist/cortexops-${{ github.ref_name }}.zip
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
